name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # Known vulnerabilities in pinned runtime dependencies fail the build.
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # High/critical advisories in runtime packages fail the build. (The moderate TipTap 2 advisory
      # is mitigated by the server sanitizer: backend/tests/test_documents.py::test_sanitizer_drops_unknown_attributes.)
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test -- --run
      - run: npm run build
